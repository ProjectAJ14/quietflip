name: quietflip
description: "An ad-free flip clock, countdown timer, and stopwatch."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.1
  bloc: ^9.0.0
  google_fonts: ^8.2.1
  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  di:
    path: ../../packages/di
  localization:
    path: ../../packages/localization
  utils:
    path: ../../packages/utils
  firebase_core: ^4.15.0
  network:
    path: ../../packages/network
  analytics:
    path: ../../packages/analytics
  crashlytics:
    path: ../../packages/crashlytics
  feature_flags:
    path: ../../packages/feature_flags
  notifications:
    path: ../../packages/notifications
  developer:
    path: ../../packages/developer
  auth:
    path: ../../features/auth
  dashboard:
    path: ../../features/dashboard
  device_services:
    path: ../../packages/device_services
  flip_clock:
    path: ../../features/flip_clock
  cloud_sync:
    path: ../../packages/cloud_sync

dev_dependencies:
  mocktail: ^1.0.4
  shared_preferences_platform_interface: ^2.4.1
  plugin_platform_interface: ^2.1.8
  firebase_core_platform_interface: ^8.1.1
  firebase_auth_platform_interface: ^9.1.0
  firebase_analytics_platform_interface: ^6.0.7
  firebase_crashlytics_platform_interface: ^3.8.10
  firebase_remote_config_platform_interface: ^3.0.7
  firebase_messaging_platform_interface: ^4.6.10
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8


flutter:
  uses-material-design: true
  assets:
    # The launch-screen logo, also drawn by the Flutter splash.
    - assets/splash/quietflip-logo.png
  fonts:
    # firebase_ui_auth ships this font but never registers it, so the Google
    # and Apple buttons render as tofu unless the app declares it here.
    - family: SocialIcons
      fonts:
        - asset: packages/firebase_ui_auth/fonts/SocialIcons.ttf
    # The web engine downloads Roboto from fonts.gstatic.com as its default
    # font unless the app bundles a family by that name. QuietFlip never
    # downloads fonts, so the name is a bundled copy of Geist (OFL,
    # assets/fonts/OFL-Geist.txt).
    - family: Roboto
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf


resolution: workspace
